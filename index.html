    <!-- Critical boot-screen CSS: paints before the game bundle has downloaded -->
    <style>
      html, body { margin: 0; height: 100%; background: #161210; }
      #boot { position: fixed; inset: 0; z-index: 100; display: grid; place-items: center; color: #f2e8d5;
        font: 500 15px/1.5 'Zen Maru Gothic', 'Hiragino Maru Gothic ProN', system-ui, sans-serif;
        background: radial-gradient(120% 90% at 50% 35%, #3a1d16 0%, #161210 70%); transition: opacity .55s ease; }
      #boot.out { opacity: 0; pointer-events: none; }
      #boot::before { content: ''; position: absolute; inset: 0; opacity: .5; pointer-events: none;
        background: repeating-linear-gradient(90deg, transparent 0 46px, rgba(184, 45, 37, .07) 46px 48px); }
      .boot-panel { position: relative; width: min(460px, 86vw); text-align: center; }
      .boot-logo { display: flex; align-items: center; justify-content: center; gap: 14px; margin-bottom: 26px; }
      .boot-logo img { width: 64px; height: 64px; filter: drop-shadow(0 8px 18px rgba(0, 0, 0, .5)); animation: boot-bob 2.4s ease-in-out infinite; }
      .boot-logo b { display: block; font: 400 34px/1 'Dela Gothic One', system-ui, sans-serif; letter-spacing: .02em; text-align: left; }
      .boot-logo span { display: block; margin-top: 6px; font-size: 12px; letter-spacing: .38em; color: #c99a3c; text-align: left; }
      #boot-bar { height: 10px; border-radius: 6px; background: rgba(242, 232, 213, .12); overflow: hidden; box-shadow: inset 0 1px 2px rgba(0, 0, 0, .5); }
      #boot-fill { height: 100%; width: 4%; border-radius: 6px; background: linear-gradient(90deg, #9c2219, #e2553f, #f2b8c0);
        animation: boot-creep 9s cubic-bezier(.08, .75, .2, 1) forwards; transition: width .45s ease; }
      #boot-label { margin: 12px 0 18px; font-size: 13px; letter-spacing: .06em; color: #cdbfa6; min-height: 1.5em; }
      #boot-tip { min-height: 3em; font-size: 14px; color: #f2e8d5; opacity: .9; transition: opacity .2s; }
      #boot-tip.swap { opacity: 0; }
      #boot-tip::before { content: 'TIP · '; color: #c99a3c; font-weight: 700; letter-spacing: .12em; font-size: 11px; }
      #boot.failed .boot-panel { text-align: left; width: min(560px, 90vw); background: #f2e8d5; color: #1f1b17; padding: 28px 30px; border-radius: 10px;
        box-shadow: 0 20px 50px rgba(0, 0, 0, .6); border-top: 6px solid #b82d25; }
      #boot.failed .boot-logo { justify-content: flex-start; margin-bottom: 14px; }
      #boot.failed .boot-logo img { width: 48px; height: 48px; animation: none; }
      #boot.failed .boot-logo b { font-size: 24px; color: #1f1b17; }
      #boot.failed h1 { font-size: 20px; margin: 0 0 10px; }
      #boot.failed li { margin: 4px 0; }
      #boot.failed pre { max-height: 180px; overflow: auto; font-size: 11px; background: #e7d8bb; padding: 8px; border-radius: 6px; white-space: pre-wrap; }
      #boot.failed button { font: inherit; font-weight: 700; color: #fff; background: #b82d25; border: 0; border-radius: 8px; padding: 10px 22px; cursor: pointer; }
      #boot.failed button:hover { background: #9c2219; }
      @keyframes boot-creep { to { width: 55%; } }
      @keyframes boot-bob { 50% { transform: translateY(-5px) rotate(-3deg); } }
      @media (prefers-reduced-motion: reduce) { #boot-fill, .boot-logo img { animation: none; } #boot-fill { width: 40%; } #boot, #boot-tip { transition: none; } }
      noscript .boot-panel { padding-top: 10vh; }
    </style>

  <body>
    <div id="boot" role="status" aria-live="polite" aria-busy="true" aria-label="Loading Sushi Empire: Tokyo">
      <div class="boot-panel">
        <div class="boot-logo"><img src="/favicon.svg" alt="" width="64" height="64" /><div><b>SUSHI EMPIRE</b><span>TOKYO · 東京</span></div></div>
        <div id="boot-bar" role="progressbar" aria-label="Loading" aria-valuemin="0" aria-valuemax="100" aria-valuenow="5"><div id="boot-fill"></div></div>
        <div id="boot-label">Loading the kitchen…</div>
        <div id="boot-tip">A chef plus a server runs a restaurant on its own, even while you explore.</div>
      </div>
    </div>
    <noscript>
      <style>#boot { display: none; }</style>
      <div style="position:fixed;inset:0;display:grid;place-items:center;background:#161210;color:#f2e8d5;font:16px/1.6 system-ui,sans-serif;padding:24px;text-align:center">
        <div style="max-width:520px">
          <h1 style="font-size:28px;margin:0 0 12px">🍣 Sushi Empire: Tokyo</h1>
          <p>This is a 3D sushi restaurant tycoon that runs right in your browser. Cook sushi by hand, hire chefs and servers, open restaurants across Asakusa, Shibuya, Shinjuku and Ginza, and sell a million pieces.</p>
          <p><b>Please enable JavaScript to play.</b> The game needs JavaScript and WebGL, and saves your progress in this browser only.</p>
        </div>
      </div>
    </noscript>
    <canvas id="game" aria-label="Sushi Empire: Tokyo game view"></canvas>
    <div id="ui-root"></div>
    <script>
      // Safety net: if the game is running but the boot module never dismissed the loader, remove it.
      // (window.game.s, not window.game: the <canvas id="game"> is also exposed as window.game.)
      (function poll() {
        var boot = document.getElementById('boot');
        if (!boot || boot.classList.contains('failed')) return;
        if (window.game && window.game.s) setTimeout(function () { if (!boot.classList.contains('failed')) boot.remove(); }, 1500);
        else setTimeout(poll, 250);
      })();
    </script>
    <script type="module" src="./src/main.ts"></script>
  </body>
